name: dsh_feature_open_in_app
description: open-in-app (dsh ui-open-in-app) of the DSH Flutter client. The session header's split button that opens the workspace directory in an application installed on the host, and its shortcut. Offered only where the host is this machine.
publish_to: none
version: 0.0.1
environment:
  sdk: ^3.13.5
resolution: workspace
dependencies:
  flutter:
    sdk: flutter
  dsh_client: ^0.0.1
  dsh_models: ^0.0.1
  dsh_i18n: ^0.0.1
  dsh_shortcuts: ^0.0.1
  dsh_slots: ^0.0.1
  dsh_theme: ^0.0.1
  dsh_ui: ^0.0.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.0.0
