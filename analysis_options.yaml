include: package:lints/recommended.yaml

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
  exclude:
    # Unmodified third-party plugin runtime plus the documented Gradle compatibility patch.
    - "third_party/flutter_inappwebview_android/**"
    - "**/*.g.dart"
    - "**/build/**"
    - "**/linux/**"

linter:
  rules:
    prefer_single_quotes: true
    always_declare_return_types: true
    unawaited_futures: true
    avoid_print: true
    # Constructors that assign private fields from named parameters, and
    # `if (x != null) 'k': x` map entries, read better than the lint's rewrite.
    prefer_initializing_formals: false
    use_null_aware_elements: false
    prefer_function_declarations_over_variables: false
