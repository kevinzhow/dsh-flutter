# CI for dsh-flutter (Whalee): the checks that run without the local dsh checkout, and an Android APK.
#
# - preflight: tool/preflight with the checks that need the pinned dsh checkout, a node install or the parity toolchain
#   skipped on purpose (listed in --allow-skip; any other skip fails the job). What ran and what was skipped is in the job summary.
# - apk: `flutter build apk --release`. Signed with the release keystore when all four repository secrets exist
#   (WHALEE_KEYSTORE_BASE64, WHALEE_KEYSTORE_PASSWORD, WHALEE_KEY_ALIAS, WHALEE_KEY_PASSWORD), otherwise with the
#   Android debug key, and the job summary says which. Pull requests from forks never receive secrets.
#
# Actions are pinned by commit SHA (the tag is in the comment). The Flutter version is the one in .fvmrc.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  preflight:
    name: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the pinned Flutter version
        id: pin
        run: echo "flutter=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ steps.pin.outputs.flutter }}
          channel: stable
          cache: true

      - name: Resolve the workspace
        run: flutter pub get

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tool/parity-requirements.txt

      - name: Python dependencies of the tool tests
        run: python -m pip install -r tool/parity-requirements.txt

      - name: tool/preflight
        # Skipped on CI, on purpose (each needs something that is not in the repository):
        #   theme-pack  regenerates the theme pack from the pinned dsh checkout (.local/dsh-src)
        #   icons       regenerates icon paths and code-language tables from the same checkout
        #   vector      replays the behaviour vectors through dsh's TypeScript code (dsh checkout + its node install)
        #   parity      the parity selftest builds its cases from dsh's locale files; only the Flutter case map is regenerated
        # Run them locally before a PR (README, "Working on it").
        env:
          FLUTTER_SDK: ${{ env.FLUTTER_ROOT }}
        run: tool/preflight --allow-skip theme-pack,icons,vector,parity

      - name: Summary
        if: always()
        run: |
          python3 -I - >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, pathlib
          p = pathlib.Path('.local/preflight.json')
          print('### tool/preflight')
          if not p.is_file():
              print('preflight did not finish.')
          else:
              r = json.loads(p.read_text())['results']
              print('| check | state | secs |\n|---|---|---:|')
              for name, v in r.items():
                  print('| %s | %s | %s |' % (name, v['state'], v['secs']))
              skipped = {n: v['reason'] for n, v in r.items() if v['state'] == 'skip'}
              if skipped:
                  print('\n**Skipped on purpose** (need the local dsh checkout, run `tool/preflight` locally):\n')
                  for n, why in skipped.items():
                      print('- `%s`: %s' % (n, why))
          PY

      - name: Upload check output
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: preflight-output
          path: .local/preflight/
          if-no-files-found: ignore

  apk:
    name: android apk
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the pinned Flutter version
        id: pin
        run: echo "flutter=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ steps.pin.outputs.flutter }}
          channel: stable
          cache: true

      - name: Resolve the workspace
        run: flutter pub get

      - name: Signing configuration
        id: signing
        # Only this step sees the secrets (a name that is not set arrives as an empty string).
        env:
          WHALEE_KEYSTORE_BASE64: ${{ secrets.WHALEE_KEYSTORE_BASE64 }}
          WHALEE_KEYSTORE_PASSWORD: ${{ secrets.WHALEE_KEYSTORE_PASSWORD }}
          WHALEE_KEY_ALIAS: ${{ secrets.WHALEE_KEY_ALIAS }}
          WHALEE_KEY_PASSWORD: ${{ secrets.WHALEE_KEY_PASSWORD }}
        run: |
          if [ -n "$WHALEE_KEYSTORE_BASE64" ] && [ -n "$WHALEE_KEYSTORE_PASSWORD" ] && [ -n "$WHALEE_KEY_ALIAS" ] && [ -n "$WHALEE_KEY_PASSWORD" ]; then
            keystore="$RUNNER_TEMP/whalee-release.jks"
            printf '%s' "$WHALEE_KEYSTORE_BASE64" | base64 --decode > "$keystore"
            KEYSTORE="$keystore" python3 -I - <<'PY'
          import os
          def esc(v):  # java.util.Properties: backslash and a leading blank are special
              v = v.replace('\\', '\\\\')
              return ('\\ ' + v[1:]) if v.startswith(' ') else v
          with open('apps/dsh_flutter/android/key.properties', 'w') as f:
              f.write('storeFile=%s\n' % esc(os.environ['KEYSTORE']))
              f.write('storePassword=%s\n' % esc(os.environ['WHALEE_KEYSTORE_PASSWORD']))
              f.write('keyAlias=%s\n' % esc(os.environ['WHALEE_KEY_ALIAS']))
              f.write('keyPassword=%s\n' % esc(os.environ['WHALEE_KEY_PASSWORD']))
          PY
            echo "mode=release" >> "$GITHUB_OUTPUT"
          else
            echo "mode=debug" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the APK
        working-directory: apps/dsh_flutter
        run: flutter build apk --release --build-number "$GITHUB_RUN_NUMBER"

      - name: Remove signing material
        if: always()
        run: rm -f apps/dsh_flutter/android/key.properties "$RUNNER_TEMP/whalee-release.jks"

      - name: Inspect the APK
        id: apk
        run: |
          apk="$(find apps/dsh_flutter/build/app/outputs/flutter-apk -name 'app-release.apk' | head -n 1)"
          test -n "$apk"
          name="whalee-${{ steps.signing.outputs.mode }}-signed-${GITHUB_SHA::8}.apk"
          cp "$apk" "$RUNNER_TEMP/$name"
          apksigner="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          "$apksigner" verify --print-certs "$RUNNER_TEMP/$name" | tee "$RUNNER_TEMP/certs.txt"
          {
            echo "name=$name"
            echo "path=$RUNNER_TEMP/$name"
          } >> "$GITHUB_OUTPUT"
          {
            echo '### Android APK'
            echo
            if [ "${{ steps.signing.outputs.mode }}" = release ]; then
              echo 'Signed with the **release keystore** from the repository secrets.'
            else
              echo '**Signed with the Android debug key** (no release keystore secrets in this run, e.g. a pull request from a fork or secrets not set up yet). Fine for testing; it is not the release identity and cannot update a release-signed install.'
            fi
            echo
            echo "- file: \`$name\` ($(du -h "$RUNNER_TEMP/$name" | cut -f1)), sha256 \`$(sha256sum "$RUNNER_TEMP/$name" | cut -d' ' -f1)\`"
            echo "- $(grep 'certificate SHA-256 digest' "$RUNNER_TEMP/certs.txt" | head -n 1)"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14
